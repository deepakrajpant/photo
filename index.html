  <!-- ============ CRITICAL INLINE BOOT SPLASH ============ -->
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(at 12% 8%, rgba(99,102,241,.95) 0%, transparent 55%),
        radial-gradient(at 88% 15%, rgba(217,70,239,.85) 0%, transparent 55%),
        radial-gradient(at 70% 95%, rgba(6,182,212,.70) 0%, transparent 55%),
        linear-gradient(135deg, #4338ca, #7c3aed);
      color: #fff;
      z-index: 9999;
      transition: opacity .45s ease;
      text-align: center;
      padding: 20px;
    }
    #boot.hidden { opacity: 0; pointer-events: none; }
    #boot .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,.4);
      animation: boot-pop .5s cubic-bezier(.2,.8,.4,1);
    }
    @keyframes boot-pop {
      from { transform: scale(.7); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    #boot h1 {
      font-size: 22px;
      font-weight: 900;
      margin: 0 0 6px;
      letter-spacing: -.5px;
    }
    #boot p {
      font-size: 11px;
      opacity: .85;
      margin: 0;
      font-weight: 800;
      letter-spacing: 2px;
    }
    #boot .spin {
      width: 30px;
      height: 30px;
      margin: 24px auto 0;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: boot-spin .9s linear infinite;
    }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>

  <!-- ============ BOOT SPLASH ============ -->
  <div id="boot" aria-hidden="true">

  <!-- ============ BOOT SPLASH DISMISSAL ============ -->
  <script>
    (function() {
      var boot = document.getElementById('boot');
      var app  = document.getElementById('app');
      if (!boot || !app) return;

      var hidden = false;
      function hideBoot() {
        if (hidden) return;
        hidden = true;
        boot.classList.add('hidden');
        setTimeout(function() {
          if (boot.parentNode) boot.remove();
        }, 500);
      }

      // Hide as soon as the app has rendered content
      if (app.children.length > 0) {
        hideBoot();
      } else {
        var obs = new MutationObserver(function() {
          if (app.children.length > 0) {
            obs.disconnect();
            hideBoot();
          }
        });
        obs.observe(app, { childList: true });
      }

      // Safety timeout — hide after 8s no matter what
      setTimeout(hideBoot, 8000);
    })();
  </script>

  <!-- ============ MAIN APP ============ -->
  <script type="module" src="./script.js"></script>

  <!-- ============ SERVICE WORKER (PWA) ============ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          // Check for updates every hour while app is open
          setInterval(function() { reg.update().catch(function(){}); }, 60 * 60 * 1000);
        }).catch(function(err) {
          console.warn('[PWA] Service Worker registration failed:', err);
        });
      });
    }
  </script>
