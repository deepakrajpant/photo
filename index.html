<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Dream Japan — JFT Mock Test</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<style>
:root{
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --purple:#6366f1;--purple2:#8b5cf6;--violet:#a855f7;
  --teal:#14b8a6;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--pink:#ec4899;
  --bg:#f8fafc;--bg2:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
  --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);
  --grad-prem:linear-gradient(135deg,#f59e0b 0%,#ec4899 50%,#8b5cf6 100%);
  --grad-teal:linear-gradient(135deg,#14b8a6 0%,#10b981 100%);
  --grad-gold:linear-gradient(135deg,#f59e0b 0%,#eab308 100%);
  --shadow:0 2px 8px rgba(15,23,42,.06);
  --shadow-lg:0 12px 32px rgba(15,23,42,.12);
  --radius:16px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:0;overflow-x:hidden}
#root{min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
h3{font-size:16px;font-weight:800}
h4{font-size:14px;font-weight:800}
p{line-height:1.6}
.muted{color:var(--muted);font-size:13px}
.small{font-size:11px}
.center{text-align:center}
.flex{display:flex;align-items:center;gap:10px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.grid-4{grid-template-columns:repeat(2,1fr)}}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.mb-1{margin-bottom:8px}.mb-2{margin-bottom:16px}.mb-3{margin-bottom:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border:0;border-radius:var(--radius-sm);font-size:14px;font-weight:800;
  cursor:pointer;transition:transform .12s,opacity .15s,box-shadow .15s;text-decoration:none;line-height:1.2;
  font-family:inherit;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.35)}
.btn-prem{background:var(--grad-prem);color:#fff;box-shadow:0 6px 20px rgba(236,72,153,.35)}
.btn-teal{background:var(--grad-teal);color:#fff;box-shadow:0 6px 20px rgba(20,184,166,.3)}
.btn-gold{background:var(--grad-gold);color:#fff;box-shadow:0 6px 20px rgba(245,158,11,.35)}
.btn-ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-warn{background:var(--orange);color:#fff}
.btn-sm{padding:8px 14px;font-size:12px}
.btn-block{width:100%}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow)}
.card-lg{border-radius:20px;padding:24px}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;
  padding:4px 10px;border-radius:20px;letter-spacing:.3px;text-transform:uppercase}
.badge-prem{background:var(--grad-prem);color:#fff}
.badge-gold{background:var(--grad-gold);color:#fff}
.badge-success{background:#d1fae5;color:#047857}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-muted{background:var(--bg2);color:var(--muted)}
.locked-badge{display:inline-flex;align-items:center;gap:4px;background:var(--grad-prem);color:#fff;
  padding:3px 8px;border-radius:10px;font-size:9px;font-weight:900;letter-spacing:.5px}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border:1.5px solid var(--border);
  border-radius:10px;background:var(--card);font-size:14px;font-family:inherit;color:var(--text);
  transition:border-color .15s}
.input:focus,textarea.input:focus,select.input:focus{outline:none;border-color:var(--purple)}
textarea.input{resize:vertical;min-height:80px;line-height:1.5}

.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border);padding:10px 0}
.topbar-inner{max-width:960px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;
  place-items:center;box-shadow:0 4px 12px rgba(99,102,241,.4);flex-shrink:0}
.logo svg{width:20px;height:20px}
.brand{flex:1;min-width:0}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.2px}
.brand p{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:1.2px}
.avatar{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);object-fit:cover;
  background:var(--bg2);flex-shrink:0}
.user-btn{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border:1px solid var(--border);
  border-radius:24px;background:var(--card);cursor:pointer;font-family:inherit}
.user-btn span{font-size:11px;font-weight:700;color:var(--text);max-width:110px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.user-btn:hover{border-color:var(--purple)}

.hero{background:var(--grad);color:#fff;border-radius:22px;padding:26px 22px;
  box-shadow:0 16px 40px rgba(99,102,241,.4);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .15s;margin-top:20px}
.hero:active{transform:scale(.985)}
.hero::after{content:"日本";position:absolute;right:-20px;bottom:-40px;font-size:130px;
  font-weight:900;opacity:.13}
.hero small{font-size:11px;letter-spacing:1.4px;font-weight:700;opacity:.85}
.hero h2{font-size:24px;margin:8px 0;font-weight:800;line-height:1.2}
.hero p{font-size:13px;opacity:.92;line-height:1.55;max-width:85%}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;
  background:rgba(255,255,255,.18);border-radius:14px;padding:14px 6px;text-align:center;
  position:relative;z-index:1}
.hero-stats strong{display:block;font-size:22px;font-weight:800;line-height:1}
.hero-stats span{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  opacity:.92;margin-top:2px;display:block}
.hero-cta{display:inline-block;margin-top:16px;background:rgba(255,255,255,.22);
  padding:10px 18px;border-radius:20px;font-size:13px;font-weight:800}

.set-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;box-shadow:var(--shadow);
  transition:all .15s;margin-bottom:10px}
.set-card:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.set-kana{width:52px;height:52px;border-radius:14px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:22px;font-weight:800;flex-shrink:0}
.set-info{flex:1;min-width:0}
.set-info small{font-size:10px;color:var(--purple);font-weight:800;letter-spacing:.8px}
.set-info h3{font-size:16px;font-weight:800;margin:2px 0;letter-spacing:.2px}
.set-info em{font-style:normal;font-size:11.5px;color:var(--muted)}

.exam-bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;
  border-bottom:1px solid var(--border);margin-bottom:10px}
.exam-bar-inner{max-width:960px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:10px}
.xback{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);
  color:var(--muted);font-size:15px;font-weight:800;cursor:pointer;flex-shrink:0}
.exam-info{flex:1;min-width:0}
.exam-info b{display:block;font-size:12.5px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.exam-info span{font-size:10.5px;color:var(--muted);font-weight:700}
.timer{display:flex;align-items:center;gap:6px;background:#fef3c7;color:#92400e;
  padding:8px 14px;border-radius:20px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--red);color:#fff;animation:pulse 1s infinite}
.timer.practice{background:#dbeafe;color:#1e40af}
@keyframes pulse{50%{transform:scale(1.06)}}
.steps{display:flex;gap:6px;margin-bottom:12px}
.step{flex:1;border-radius:10px;padding:9px 2px;text-align:center;font-size:9.5px;font-weight:800;
  background:var(--card);border:1px solid var(--border);color:var(--muted);letter-spacing:.4px}
.step.cur{background:var(--grad);border-color:transparent;color:#fff}
.step.done{background:#d1fae5;border-color:var(--green);color:#047857}
.progress-bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px}
.progress-bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:6px;
  transition:width .35s}
.palette{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.palette::-webkit-scrollbar{display:none}
.pal-btn{min-width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;flex-shrink:0}
.pal-btn.ans{background:#fef3c7;color:#92400e;border-color:var(--orange)}
.pal-btn.cur{background:var(--grad);color:#fff;border-color:transparent}
.pal-btn:disabled{opacity:.3;cursor:not-allowed;border-style:dashed}

.q-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 16px;
  box-shadow:var(--shadow);margin-bottom:14px}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.q-num{font-size:11.5px;font-weight:800;color:var(--purple);white-space:nowrap}
.q-tag{font-size:10px;font-weight:800;background:var(--bg2);padding:4px 9px;border-radius:20px;
  color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.q-marks{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.passage{background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--purple);
  border-radius:10px;padding:14px;font-size:14.5px;line-height:1.75;margin-bottom:14px;
  white-space:pre-line;text-align:left}
.q-text{font-size:18px;font-weight:700;line-height:1.6;margin-bottom:14px;white-space:pre-line;
  text-align:left}
.media{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.media img{width:100%;border-radius:14px;border:1px solid var(--border);display:block;max-height:360px;object-fit:contain;background:var(--bg2)}
.audio-row{display:flex;align-items:center;gap:10px;background:var(--bg);
  border:1px solid var(--border);padding:12px 14px;border-radius:14px}
.play-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--grad);color:#fff;
  font-size:16px;cursor:pointer;flex-shrink:0;font-weight:800}
.play-btn.rep{width:38px;height:38px;background:var(--bg2);color:var(--purple);font-size:18px}
.wave{display:flex;align-items:center;gap:3px;height:26px;flex:1;min-width:0;overflow:hidden}
.wave i{width:4px;height:8px;border-radius:3px;background:var(--purple);opacity:.4;flex-shrink:0}
.audio-row.on .wave i{animation:w .7s ease-in-out infinite;opacity:1}
.wave i:nth-child(2n){animation-delay:.15s}
.wave i:nth-child(3n){animation-delay:.3s}
@keyframes w{50%{height:24px}}
.audio-row span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--border);
  border-radius:13px;background:var(--card);cursor:pointer;transition:all .16s}
.opt:hover{border-color:var(--purple2)}
.opt.sel{border-color:var(--purple);background:#eef2ff;transform:translateX(3px)}
.opt.correct{border-color:var(--green);background:#d1fae5}
.opt.wrong{border-color:var(--red);background:#fee2e2}
.opt.locked{cursor:default}
.opt-ltr{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);display:grid;
  place-items:center;font-size:11.5px;font-weight:800;color:var(--muted);flex-shrink:0}
.opt.sel .opt-ltr{background:var(--purple);border-color:var(--purple);color:#fff}
.opt.correct .opt-ltr{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong .opt-ltr{background:var(--red);border-color:var(--red);color:#fff}
.opt-tx{font-size:14.5px;font-weight:500;line-height:1.45;text-align:left}
.opt.sel .opt-tx{font-weight:700;color:var(--purple)}

.exam-nav{display:flex;gap:11px;margin-top:auto;padding-top:12px}
.exam-nav .btn{flex:1}

.result-card{background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:26px 20px;box-shadow:var(--shadow);text-align:center}
.result-badge{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:1.4px;
  padding:8px 20px;border-radius:22px;margin-bottom:14px}
.result-badge.pass{background:#d1fae5;color:#047857}
.result-badge.fail{background:#fee2e2;color:#991b1b}
.ring{position:relative;width:160px;height:160px;margin:0 auto 12px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--border)}
.ring .fg{transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.4,1)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:42px;font-weight:900;line-height:1;letter-spacing:-1px}
.ring span{font-size:12px;color:var(--muted);font-weight:800;margin-top:4px}
.grade-text{font-size:14.5px;font-weight:800;margin-bottom:20px;line-height:1.5}
.result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg);
  padding:14px 4px;border-radius:14px}
.result-stats h4{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;
  font-weight:800}
.result-stats p{font-size:18px;font-weight:900;margin-top:2px}
.result-stats p.g{color:var(--green)}
.result-stats p.r{color:var(--red)}

.admin-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none;
  border-bottom:1px solid var(--border);margin-bottom:16px}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:9px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);
  font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:inherit}
.admin-tab.on{background:var(--grad);border-color:transparent;color:#fff}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;
  box-shadow:var(--shadow)}
.stat-card .num{font-size:24px;font-weight:900;line-height:1}
.stat-card .lbl{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;
  letter-spacing:.4px;margin-top:6px}
.admin-q-item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.admin-q-item .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.admin-q-item .qtxt{font-size:13.5px;line-height:1.5;margin-bottom:8px;word-break:break-word;
  white-space:pre-line}
.admin-q-item .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin-q-item .actions button{padding:7px 14px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.admin-q-item .actions button.edit{color:var(--purple);border-color:var(--purple)}
.admin-q-item .actions button.del{color:var(--red);border-color:var(--red)}
.admin-q-item .actions button.preview{color:var(--teal);border-color:var(--teal)}
.admin-q-item .actions button:hover{filter:brightness(.95)}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;
  justify-content:center;z-index:200;padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal-card{background:var(--card);border-radius:20px;padding:22px;max-width:560px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);margin:20px auto;animation:slideIn .25s}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-card h3{font-size:17px;font-weight:800;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn{flex:1}
@media(max-width:480px){.modal-card{padding:18px;border-radius:16px}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:24px;font-size:13px;
  font-weight:700;z-index:300;opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw;text-align:center;line-height:1.4}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}

.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:24px;text-align:center}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--purple);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;font-weight:600;line-height:1.6}
.empty .big{font-size:42px;margin-bottom:12px}

.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(circle at 20% 0%,rgba(99,102,241,.15),transparent 50%),
             radial-gradient(circle at 80% 100%,rgba(236,72,153,.12),transparent 50%)}
.login-card{background:var(--card);border-radius:22px;padding:32px 24px;max-width:400px;width:100%;
  box-shadow:var(--shadow-lg);border:1px solid var(--border)}
.login-logo{width:56px;height:56px;border-radius:50%;background:var(--grad);display:grid;
  place-items:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(99,102,241,.4)}
.login-logo svg{width:28px;height:28px}
.login-card h2{text-align:center;font-size:22px;margin-bottom:6px}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.5}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;
  border:1.5px solid var(--border);border-radius:12px;background:var(--card);font-size:14px;
  font-weight:800;cursor:pointer;transition:all .15s;font-family:inherit;margin-bottom:12px}
.gbtn:hover{border-color:var(--purple);background:#f5f3ff}
.gbtn:disabled{opacity:.5}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--muted);
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.login-link{text-align:center;font-size:12px;margin-top:16px;color:var(--muted)}
.login-link a{color:var(--purple);font-weight:800;text-decoration:none;cursor:pointer}

.plan-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:20px;
  margin-bottom:12px;transition:all .15s}

/* ============================================================
   UTILS
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const pad = n => String(n).padStart(2, "0");

let toastTimer;
function toast(msg, type = "") {
  const t = $("toast"); t.textContent = msg; t.className = "toast show" + (type ? " " + type : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function modal(title, bodyHTML, buttons) {
  const m = $("modal");
  const btnHtml = (buttons || [{ label: "OK", cls: "btn-primary" }]).map((b, i) =>
    `<button class="btn ${b.cls || "btn-primary"}" data-idx="${i}">${b.label}</button>`).join("");
  m.innerHTML = `<div class="modal-card">
    <h3>${esc(title)}</h3>
    <div>${bodyHTML}</div>
    <div class="modal-actions">${btnHtml}</div>
  </div>`;
  m.classList.add("show");
  m.querySelectorAll(".modal-actions button").forEach(btn => {
    btn.onclick = () => {
      m.classList.remove("show");
      const b = (buttons || [{}])[+btn.dataset.idx];
      if (b && b.onClick) b.onClick();
    };
  });
}
function closeModal() { $("modal").classList.remove("show"); }

function fmtDate(ts) {
  if (!ts) return "—";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
function daysLeft(ts) {
  if (!ts) return 0;
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return Math.max(0, Math.ceil((d - Date.now()) / 86400000));
}
function todayStr() { return new Date().toISOString().slice(0, 10); }

/* Resolve image/audio URL — supports GitHub relative paths */
function resolveUrl(url) {
  if (!url) return "";
  url = String(url).trim();
  if (!url) return "";
  if (url.startsWith("data:") || url.startsWith("blob:")) return url;
  if (url.startsWith("scene:") || url.startsWith("tts:")) return url;
  if (url.startsWith("http://") || url.startsWith("https://")) {
    const gh = url.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/i);
    if (gh) return `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/${gh[3]}`;
    return url;
  }
  if (url.startsWith("//")) return "https:" + url;
  if (!ASSET_BASE) return url;
  return ASSET_BASE.replace(/\/+$/, "") + "/" + url.replace(/^\/+/, "");
}

function sceneData(kind) {
  const sky = { rain:"#7f94a8", sun:"#6ec1f2", snow:"#c8d6e5", cloud:"#9fb3c4" }[kind] || "#6ec1f2";
  let x = "";
  if (kind === "sun") x = `<circle cx="300" cy="55" r="30" fill="#ffd23f"/>`;
  else x = `<ellipse cx="110" cy="52" rx="55" ry="22" fill="#fff" opacity=".88"/>
    <ellipse cx="255" cy="44" rx="60" ry="24" fill="#fff" opacity=".88"/>`;
  if (kind === "rain") for (let i = 0; i < 24; i++)
    x += `<line x1="${20+i*15}" y1="${90+(i*37)%60}" x2="${14+i*15}" y2="${110+(i*37)%60}" stroke="#d8ecff" stroke-width="2"/>`;
  if (kind === "snow") for (let i = 0; i < 22; i++)
    x += `<circle cx="${15+i*16}" cy="${95+(i*53)%90}" r="3" fill="#fff"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200">
    <rect width="360" height="200" fill="${sky}"/>${x}
    <rect y="165" width="360" height="35" fill="#5d8a4e"/>
    <polygon points="170,165 215,95 260,165" fill="#c94536"/></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

function qId(set, section, qText) {
  return `${set}|${section}|${String(qText).slice(0, 30)}|${String(qText).length}`;
}

function canTakeExam() {
  const p = state.profile || {};
  return state.isAdmin || p.practiceAccess || (p.premium && daysLeft(p.premium.expiry) > 0);
}
function canUsePremium() {
  const p = state.profile || {};
  return state.isAdmin || (p.premium && daysLeft(p.premium.expiry) > 0);
}

/* ============================================================
   FIRESTORE HELPERS
   ============================================================ */
function normalizeRow(r) {
  if (!r) return null;
  if (Array.isArray(r)) {
    if (r.length < 11) return null;
    return {
      set: Number(r[0]) || 1,
      section: String(r[1] || "sv").toLowerCase(),
      question: String(r[2] || "").trim(),
      passage: String(r[3] || "").trim(),
      image: String(r[4] || "").trim(),
      audio: String(r[5] || "").trim(),
      answer: String(r[6] || "A").toUpperCase(),
      A: String(r[7] || "").trim(),
      B: String(r[8] || "").trim(),
      C: String(r[9] || "").trim(),
      D: String(r[10] || "").trim(),
      explanation: String(r[11] || "").trim()
    };
  }
  return {
    set: Number(r.set) || 1,
    section: String(r.section || "sv").toLowerCase(),
    question: String(r.question || "").trim(),
    passage: String(r.passage || "").trim(),
    image: String(r.image || "").trim(),
    audio: String(r.audio || "").trim(),
    answer: String(r.answer || "A").toUpperCase(),
    A: String(r.A || "").trim(),
    B: String(r.B || "").trim(),
    C: String(r.C || "").trim(),
    D: String(r.D || "").trim(),
    explanation: String(r.explanation || "").trim()
  };
}

function getCache() {
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (!c || c.v !== 3 || !Array.isArray(c.rows)) return null;
    return c;
  } catch { return null; }
}
function setCache(rows) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ v: 3, ts: Date.now(), rows })); } catch {}
}
function clearQCache() { try { localStorage.removeItem(CACHE_KEY); } catch {} }

async function fetchQuestionsFromFirestore() {
  const snap = await getDoc(doc(db, QUESTIONS_DOC));
  if (!snap.exists()) throw new Error("Questions document not found");
  const data = snap.data();
  let rows = null;
  if (Array.isArray(data)) rows = data;
  else if (Array.isArray(data.questions)) rows = data.questions;
  else for (const k of Object.keys(data)) {
    if (Array.isArray(data[k])) { rows = data[k]; break; }
  }
  if (!rows || !rows.length) throw new Error("No questions found");
  return rows.map(normalizeRow).filter(Boolean);
}

async function loadQuestions(force = false) {
  const cached = getCache();
  if (!force && cached && (Date.now() - cached.ts) < CACHE_TTL) {
    return { rows: cached.rows, fromCache: true, ts: cached.ts };
  }
  try {
    const rows = await fetchQuestionsFromFirestore();
    setCache(rows);
    return { rows, fromCache: false, ts: Date.now() };
  } catch (e) {
    if (cached) return { rows: cached.rows, fromCache: true, ts: cached.ts, error: e };
    throw e;
  }
}

function buildSets(rows) {
  const sets = SET_NAMES.map((n, i) => ({
    idx: i + 1, name: n.name, kana: n.kana,
    sections: SECTIONS.map(s => ({
      key: s.key, name: s.name, short: s.short, marks: s.marks, count: 0, questions: []
    }))
  }));
  rows.forEach(r => {
    const row = normalizeRow(r);
    if (!row || row.set < 1 || row.set > 6) return;
    const set = sets[row.set - 1];
    const sec = set.sections.find(s => s.key === row.section);
    if (!sec) return;
    const ansIdx = Math.max(0, Math.min(3, row.answer.charCodeAt(0) - 65));
    sec.questions.push({
      q: row.question, p: row.passage || null,
      img: row.image ? (row.image.startsWith("scene:") ? sceneData(row.image.slice(6)) : resolveUrl(row.image)) : null,
      imgRaw: row.image || "",
      au: row.audio || "",
      expl: row.explanation || "",
      o: [row.A, row.B, row.C, row.D],
      a: ansIdx, sel: undefined, locked: false, played: 0
    });
  });
  sets.forEach(s => s.sections.forEach(sec => sec.count = sec.questions.length));
  return sets;
}

function recomputeTotals() {
  if (!state.sets.length) return;
  const secs = state.sets[0].sections;
  totalQ = secs.reduce((a, s) => a + s.questions.length, 0);
  fullMarks = secs.reduce((a, s) => a + s.questions.length * s.marks, 0);
  passMarks = Math.round(fullMarks * 0.8);
}

/* ============================================================
   DATA LOADING (parallel = fast!)
   ============================================================ */
async function loadUserProfile(uid) {
  try {
    const snap = await getDoc(doc(db, "users", uid));
    return snap.exists() ? { uid, ...snap.data() } : null;
  } catch (e) { console.error("loadUserProfile", e); return null; }
}

async function ensureUserProfile(user) {
  const ref = doc(db, "users", user.uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    updateDoc(ref, { lastLogin: serverTimestamp() }).catch(() => {});
    return { uid: user.uid, ...snap.data() };
  }
  const isAdmin = user.email === ADMIN_EMAIL && user.emailVerified;
  const profile = {
    name: user.displayName || (user.email || "").split("@")[0],
    email: user.email || "",
    photoURL: user.photoURL || "",
    emailVerified: !!user.emailVerified,
    role: isAdmin ? "admin" : "student",
    status: "active",
    practiceAccess: false,
    premium: null,
    bookmarks: [],
    streakDays: 1,
    lastActiveDate: todayStr(),
    createdAt: serverTimestamp(),
    lastLogin: serverTimestamp()
  };
  await setDoc(ref, profile);
  return { uid: user.uid, ...profile };
}

async function loadPlans() {
  try {
    const snap = await getDocs(collection(db, "plans"));
    const plans = [];
    snap.forEach(d => plans.push({ id: d.id, ...d.data() }));
    plans.sort((a, b) => (a.price || 0) - (b.price || 0));
    if (!plans.length) {
      const defs = [
        { id: "p15", name: "Starter", price: 500, days: 15, active: true, featured: false,
          benefits: ["All 6 full mock sets", "Unlimited attempts", "Answer explanations", "Progress tracking"] },
        { id: "p30", name: "Pro", price: 900, days: 30, active: true, featured: true,
          benefits: ["Everything in Starter", "Section-wise practice", "Custom timed practice", "Weak area detection", "Priority support"] },
        { id: "p90", name: "Elite", price: 2000, days: 90, active: true, featured: false, gold: true,
          benefits: ["Everything in Pro", "Daily challenges", "Study streak tracking", "Advanced analytics", "Bookmarks & flashcards"] }
      ];
      for (const p of defs) await setDoc(doc(db, "plans", p.id), p);
      return defs;
    }
    return plans;
  } catch (e) { console.error("loadPlans", e); return []; }
}

async function loadConfig() {
  try {
    const snap = await getDoc(doc(db, "appConfig", "github"));
    if (snap.exists()) {
      const cfg = snap.data();
      if (cfg.baseUrl) ASSET_BASE = cfg.baseUrl;
    }
  } catch (e) { console.warn("loadConfig", e); }
}

async function loadResults(uid) {
  try {
    const q = query(collection(db, "users", uid, "results"), orderBy("submittedAt", "desc"), limit(30));
    const snap = await getDocs(q);
    const out = [];
    snap.forEach(d => out.push({ id: d.id, ...d.data() }));
    return out;
  } catch (e) { console.error("loadResults", e); return []; }
}

async function touchStreak() {
  if (!state.user || !state.profile) return;
  const p = state.profile;
  const today = todayStr();
  if (p.lastActiveDate === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  const newStreak = p.lastActiveDate === yesterday ? (p.streakDays || 0) + 1 : 1;
  try {
    await updateDoc(doc(db, "users", state.user.uid), {
      lastActiveDate: today, streakDays: newStreak
    });
    state.profile.streakDays = newStreak;
    state.profile.lastActiveDate = today;
  } catch {}
}

/* ============================================================
   AUTH
   ============================================================ */
async function handleGoogleLogin() {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request",
         "auth/operation-not-supported-in-this-environment"].includes(e.code)) {
      try { await signInWithRedirect(auth, provider); } catch (re) { toast(re.message, "err"); }
    } else {
      toast("Login failed: " + (e.code || e.message), "err");
    }
  }
}
async function handleEmailLogin(email, pass) {
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch (e) {
    let msg = "Login failed";
    if (e.code === "auth/user-not-found") msg = "No account with this email";
    else if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Incorrect email or password";
    else if (e.code === "auth/invalid-email") msg = "Invalid email";
    toast(msg, "err");
  }
}
async function handleEmailSignup(email, pass, name) {
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await setDoc(doc(db, "users", cred.user.uid), {
      name: name || email.split("@")[0], email, photoURL: "", emailVerified: false,
      role: "student", status: "active", practiceAccess: false, premium: null,
      bookmarks: [], streakDays: 1, lastActiveDate: todayStr(),
      createdAt: serverTimestamp(), lastLogin: serverTimestamp()
    });
    try { await sendEmailVerification(cred.user); } catch {}
    toast("Account created! Check email to verify.", "ok");
  } catch (e) {
    let msg = "Signup failed";
    if (e.code === "auth/email-already-in-use") msg = "Email already in use";
    else if (e.code === "auth/weak-password") msg = "Password too weak (6+ chars)";
    else if (e.code === "auth/invalid-email") msg = "Invalid email";
    toast(msg, "err");
  }
}
async function handlePasswordReset(email) {
  try { await sendPasswordResetEmail(auth, email); toast("Reset link sent", "ok"); }
  catch (e) { toast("Failed: " + e.message, "err"); }
}
async function handleLogout() {
  if (state.userSub) { state.userSub(); state.userSub = null; }
  if (state._tick) { clearInterval(state._tick); state._tick = null; }
  stopAudio();
  await signOut(auth);
}

/* ============================================================
   ROUTER
   ============================================================ */
function navigate(screen, params = {}) {
  if (state.screen === "exam" && screen !== "exam") {
    if (state._tick) { clearInterval(state._tick); state._tick = null; }
    stopAudio();
  }
  state.screen = screen;
  state.params = params;
  render();
  window.scrollTo(0, 0);
}

function render() {
  const r = $("root");
  const s = state.screen;
  if (s === "loading") r.innerHTML = renderLoading();
  else if (s === "login") { r.innerHTML = renderLogin(); attachLoginHandlers(); }
  else if (s === "signup") { r.innerHTML = renderSignup(); attachSignupHandlers(); }
  else if (s === "home") r.innerHTML = renderHome();
  else if (s === "sets") r.innerHTML = renderSets();
  else if (s === "start") r.innerHTML = renderStart();
  else if (s === "exam") r.innerHTML = renderExam();
  else if (s === "result") r.innerHTML = renderResult();
  else if (s === "review") r.innerHTML = renderReview();
  else if (s === "profile") r.innerHTML = renderProfile();
  else if (s === "premium") r.innerHTML = renderPremium();
  else if (s === "admin") r.innerHTML = renderAdmin();
  else if (s === "bookmarks") r.innerHTML = renderBookmarks();
  else if (s === "analytics") r.innerHTML = renderAnalytics();
  else if (s === "error") r.innerHTML = renderError(state.params.msg);
  else r.innerHTML = renderLoading();
  postRender();
}

function postRender() {
  const agree = $("agree");
  if (agree) agree.onchange = () => { $("startBtn").disabled = !agree.checked; };
  const startBtn = $("startBtn");
  if (startBtn && agree) startBtn.onclick = () => {
    if (!agree.checked) return toast("Please agree to the rules", "err");
    beginExam();
  };
  document.querySelectorAll('[data-play="1"]').forEach(btn => {
    btn.onclick = () => {
      const ex = state.exam;
      if (!ex) return;
      const q = ex.set.sections[ex.si].questions[ex.qi];
      playAudio(q);
    };
  });
  const ring = $("resultRing");
  if (ring && state.params.result) {
    setTimeout(() => { ring.style.strokeDashoffset = 427.3 * (1 - state.params.result.percentage / 100); }, 100);
  }
  if (state.screen === "admin") attachAdminHandlers();
}

function renderExam() {
  const ex = state.exam;
  if (!ex) return renderSets();
  const sec = ex.set.sections[ex.si];
  const q = sec.questions[ex.qi];
  const isPractice = ex.mode === "practice";
  const showFeedback = isPractice && q.sel !== undefined;
  const isBookmarked = state.bookmarks.has(qId(ex.set.idx, sec.key, q.q));

  let mediaHTML = "";
  if (q.img) mediaHTML += `<img src="${esc(q.img)}" loading="lazy" onerror="this.style.display='none'">`;
  if (q.au) mediaHTML += `<div class="audio-row" id="audRow">
    <button class="play-btn" data-play="1">▶</button>
    <button class="play-btn rep" data-play="1">↻</button>
    <div class="wave">${'<i></i>'.repeat(18)}</div>
    <span>${isPractice ? "∞" : Math.max(0, MAX_PLAYS - q.played) + " left"}</span></div>`;
  if (mediaHTML) mediaHTML = `<div class="media">${mediaHTML}</div>`;

  const optsHTML = q.o.slice(0, q.o[3] ? 4 : 3).map((t, i) => {
    let cls = "";
    if (showFeedback) {
      if (i === q.a) cls = "correct locked";
      else if (i === q.sel) cls = "wrong locked";
      else cls = "locked";
    } else if (q.sel === i) cls = "sel";
    return `<div class="opt ${cls}" onclick="window.__dj.selectOpt(${i})">
      <div class="opt-ltr">${"ABCD"[i]}</div>
      <div class="opt-tx">${esc(t)}</div>
    </div>`;
  }).join("");

  const feedbackHTML = showFeedback ? `
    <div class="feedback ${q.sel === q.a ? "correct" : "wrong"}">
      <h4>${q.sel === q.a ? "✓ Correct!" : "✗ Not quite"}</h4>
      ${q.sel !== q.a ? `<p>Correct answer: <strong>${"ABCD"[q.a]}</strong></p>` : ""}
      ${q.expl && canUsePremium() ? `<div class="explanation"><strong>Explanation:</strong> ${esc(q.expl)}</div>` : ""}
      ${q.expl && !canUsePremium() ? `<div class="explanation muted">🔒 Explanation available with Premium</div>` : ""}
    </div>` : "";

  const isLastQ = ex.qi === sec.questions.length - 1;
  const isLastSec = ex.si === ex.set.sections.length - 1;
  const nextLabel = isPractice
    ? (isLastQ ? "Finish Practice ✓" : "Next →")
    : (isLastQ ? (isLastSec ? "Submit Exam ✓" : "Finish Section →") : "Next →");

  const timerHTML = isPractice
    ? `<div class="timer practice">📝 Practice</div>`
    : `<div class="timer ${ex.left <= 600 ? "low" : ""}" id="timerDisplay">⏱ <span>${pad(Math.floor(ex.left / 60))}:${pad(ex.left % 60)}</span></div>`;

  const stepsHTML = isPractice
    ? `<div class="steps"><div class="step cur" style="flex:1">${sec.short} PRACTICE</div></div>`
    : `<div class="steps">${ex.set.sections.map((s, i) =>
        `<div class="step ${i === ex.si ? "cur" : i < ex.si ? "done" : ""}">${s.short}</div>`).join("")}</div>`;

  return `<div class="exam-bar"><div class="exam-bar-inner">
    <button class="xback" onclick="window.__dj.askLeave()">✕</button>
    <div class="exam-info">
      <b>Set ${ex.set.idx} · ${ex.set.name}</b>
      <span>${isPractice ? sec.name + " — Practice" : `Section ${ex.si + 1} of 4 — ${sec.name}`}</span>
    </div>
    ${timerHTML}
  </div></div>

  <div class="wrap" style="padding-bottom:40px">
    ${stepsHTML}
    <div class="progress-bar"><i style="width:${(ex.answeredCount / sec.questions.length) * 100}%"></i></div>
    <div class="palette">${sec.questions.map((qq, i) =>
      `<button class="pal-btn ${qq.sel !== undefined ? "ans" : ""} ${i === ex.qi ? "cur" : ""}"
        ${(!isPractice && i > ex.maxReachable) ? "disabled" : ""}
        onclick="window.__dj.jumpTo(${i})">${i + 1}</button>`).join("")}</div>

    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">Q ${ex.qi + 1} of ${sec.count}</span>

    <div class="card mt-2">
      <h3 class="mb-2">Section Breakdown</h3>
      ${r.sections.map(s => {
        const p = s.max ? Math.round(s.score / s.max * 100) : 0;
        const cls = p >= 80 ? "high" : p >= 50 ? "mid" : "low";
        return `<div class="stat-bar">
          <div class="lbl"><span>${esc(s.name)}</span><span>${s.score} / ${s.max} (${p}%)</span></div>
          <div class="track"><div class="fill ${cls}" style="width:${p}%"></div></div>
        </div>`;
      }).join("")}

    ${weak.length && !weak[0].pct ? "" : weak.length ? `
    <div class="card mt-2" style="background:#fef3c7;border-color:var(--orange)">
      <h3 class="mb-1">💡 Weak Area</h3>
      <p class="small" style="font-weight:700">Focus on <strong>${esc(weak[0].name)}</strong> (${weak[0].pct}%) to boost your score.</p>
    </div>` : ""}

    <div class="grid-2 mt-2">
      <button class="btn btn-ghost" onclick="window.__dj.openReview('all')">All Answers</button>
      <button class="btn btn-ghost" onclick="window.__dj.openReview('wrong')">Wrong Only</button>
    </div>
    <button class="btn btn-primary btn-block mt-1" onclick="window.__dj.retrySet()">Try Again</button>
    <button class="btn btn-ghost btn-block mt-1" onclick="window.__dj.goSets()">Back to Sets</button>
  </div>`;
}

function getWeakAreas(results) {
  const map = {};
  results.forEach(r => {
    (r.sections || []).forEach(s => {
      const key = s.short.toLowerCase();
      if (!map[key]) map[key] = { name: s.name, score: 0, max: 0 };
      map[key].score += s.score;
      map[key].max += s.max;
    });
  });
  return Object.entries(map)
    .map(([k, v]) => ({ key: k, name: v.name, pct: v.max ? Math.round(v.score / v.max * 100) : 0 }))
    .sort((a, b) => a.pct - b.pct);
}

/* ============================================================
   EXAM ENGINE
   ============================================================ */
function beginExam() {
  const setIdx = state.params.setIdx;
  const set = state.sets[setIdx];
  if (!set) return;
  set.sections.forEach(sec => sec.questions.forEach(q => {
    q.sel = undefined; q.locked = false; q.played = 0;
  }));
  state.exam = {
    mode: "exam", set, setIdx, si: 0, qi: 0,
    left: EXAM_MIN * 60, paused: false,
    answeredCount: 0, maxReachable: 0, startedAt: Date.now()
  };
  startTimer();
  navigate("exam");
}

function beginSectionPractice(sectionKey) {
  const setIdx = state.params.setIdx;
  const set = state.sets[setIdx];
  if (!set) return;
  const sec = set.sections.find(s => s.key === sectionKey);
  if (!sec) return;
  sec.questions.forEach(q => { q.sel = undefined; q.locked = false; q.played = 0; });
  state.exam = {
    mode: "practice", set, setIdx, si: set.sections.indexOf(sec), qi: 0,
    left: 0, paused: false, answeredCount: 0, maxReachable: 999,
    startedAt: Date.now(), practiceSection: sec
  };
  navigate("exam");
}

function startDailyChallenge() {
  // Random 10 questions from all sets
  const all = [];
  state.sets.forEach(s => s.sections.forEach(sec => sec.questions.forEach(q => {
    all.push({ set: s.idx, section: sec.key, sectionName: sec.name, marks: sec.marks, q });
  })));
  const shuffled = all.sort(() => Math.random() - 0.5).slice(0, 10);
  const fakeSet = {
    idx: 99, name: "DAILY", kana: "🎯",
    sections: [{ key: "daily", name: "Daily Challenge", short: "DAILY", marks: 1, count: 10, questions: shuffled.map(x => x.q) }]
  };
  state.exam = {
    mode: "practice", set: fakeSet, setIdx: 0, si: 0, qi: 0,
    left: 0, paused: false, answeredCount: 0, maxReachable: 999,
    startedAt: Date.now(), practiceSection: fakeSet.sections[0]
  };
  navigate("exam");
}

function startTimer() {
  if (state._tick) clearInterval(state._tick);
  state._tick = setInterval(() => {
    const ex = state.exam;
    if (!ex || ex.paused || ex.mode === "practice") return;
    ex.left--;
    const el = $("timerDisplay");
    if (el) {
      el.innerHTML = `⏱ <span>${pad(Math.floor(ex.left / 60))}:${pad(ex.left % 60)}</span>`;
      el.classList.toggle("low", ex.left <= 600);
    }
    if (ex.left <= 0) {
      clearInterval(state._tick);
      modal("Time is up!", "Submitting automatically…", [{ label: "View Results", cls: "btn-primary", onClick: finishExam }]);
    }
  }, 1000);
}

function stopAudio() {
  if (state._audio) { try { state._audio.pause(); } catch {} state._audio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

function selectOpt(i) {
  const ex = state.exam;
  if (!ex) return;
  const sec = ex.set.sections[ex.si];
  const q = sec.questions[ex.qi];
  if (ex.mode === "practice" && q.sel !== undefined) return; // locked after answer
  if (q.locked) return;
  q.sel = i;
  ex.answeredCount = sec.questions.filter(x => x.sel !== undefined).length;
  if (ex.qi > ex.maxReachable) ex.maxReachable = ex.qi;
  render();
}

function jumpTo(i) {
  const ex = state.exam;
  if (!ex) return;
  if (ex.mode === "exam" && i > ex.maxReachable) return;
  ex.qi = i;
  render();
}

function prevQ() {
  const ex = state.exam;
  if (ex && ex.qi > 0) { ex.qi--; render(); }
}

function nextQ() {
  const ex = state.exam;
  if (!ex) return;
  const sec = ex.set.sections[ex.si];
  const q = sec.questions[ex.qi];
  if (q.sel === undefined) return;

  if (ex.mode === "practice") {
    // In practice mode, allow completing when last question reached
    if (ex.qi < sec.questions.length - 1) {
      ex.qi++; render();
    } else {
      finishPractice();
    }
    return;
  }

  if (ex.qi < sec.questions.length - 1) {
    ex.qi++;
    if (ex.qi > ex.maxReachable) ex.maxReachable = ex.qi;
    render();
  } else {
    finishSection();
  }
}

function finishSection() {
  const ex = state.exam;
  const sec = ex.set.sections[ex.si];
  const unanswered = sec.questions.filter(x => x.sel === undefined).length;
  const isLast = ex.si === ex.set.sections.length - 1;
  modal(isLast ? "Submit your exam?" : "Complete this section?",
    (unanswered ? `${unanswered} unanswered. ` : "") +
    (isLast ? "You cannot change answers after submitting." : "You cannot return to this section."),
    [
      { label: "Review", cls: "btn-ghost" },
      { label: isLast ? "Submit" : "Continue", cls: "btn-primary", onClick: () => {
        sec.questions.forEach(q => q.locked = true);
        if (isLast) finishExam();
        else { ex.si++; ex.qi = 0; ex.maxReachable = 0; render(); }
      }}
    ]);
}

async function finishPractice() {
  stopAudio();
  const ex = state.exam;
  const sec = ex.set.sections[ex.si];
  let correct = 0;
  sec.questions.forEach(q => { if (q.sel === q.a) correct++; });
  const pct = Math.round((correct / sec.questions.length) * 100);
  modal("Practice Complete!",
    `<div class="center"><div style="font-size:48px">🎉</div>
     <h3 style="margin:10px 0">${correct} / ${sec.questions.length} correct (${pct}%)</h3>
     <p class="muted small">Great effort! Keep practising.</p></div>`,
    [
      { label: "Back to Sets", cls: "btn-ghost", onClick: () => { state.exam = null; navigate("sets"); } },
      { label: "Home", cls: "btn-primary", onClick: () => { state.exam = null; navigate("home"); } }
    ]);
}

async function finishExam() {
  if (state._tick) { clearInterval(state._tick); state._tick = null; }
  stopAudio();
  const ex = state.exam;
  const used = EXAM_MIN * 60 - ex.left;

  let score = 0, correct = 0, unanswered = 0;
  const sections = ex.set.sections.map(s => {
    const items = s.questions.map((q, idx) => ({
      idx, q: q.q, p: q.p, imgRaw: q.imgRaw || "", au: q.au, o: q.o,
      correctAns: q.a, yourAns: q.sel, expl: q.expl || ""
    }));
    let c = 0, u = 0;
    s.questions.forEach(q => {
      if (q.sel === undefined) u++;
      else if (q.sel === q.a) c++;
    });
    const sc = c * s.marks;
    score += sc; correct += c; unanswered += u;
    return { name: s.name, short: s.short, marks: s.marks, score: sc, max: s.questions.length * s.marks, items };
  });

  const wrong = totalQ - correct - unanswered;
  const percentage = Math.round(score / fullMarks * 100);

  const result = {
    setIdx: ex.set.idx, setName: ex.set.name,
    score, maxScore: fullMarks, percentage,
    correct, wrong, unanswered, sections,
    timeUsed: used,
    startedAt: new Date(ex.startedAt),
    submittedAt: new Date()
  };

  try {
    const attemptId = `attempt_${ex.startedAt}_${Math.random().toString(36).slice(2, 8)}`;
    await setDoc(doc(db, "users", state.user.uid, "results", attemptId), {
      ...result, startedAt: result.startedAt, submittedAt: serverTimestamp()
    });
    state.results.unshift({ ...result, id: attemptId });
    touchStreak();
  } catch (e) {
    console.error("Save result", e);
    toast("Result saved locally (server error).", "err");
  }

  state.params.result = result;
  navigate("result");
}

function askLeave() {
  const ex = state.exam;
  if (ex) ex.paused = true;
  stopAudio();
  modal("Leave the exam?", "Progress will be lost.",
    [
      { label: "Stay", cls: "btn-ghost", onClick: () => { if (ex) ex.paused = false; } },
      { label: "Leave", cls: "btn-danger", onClick: () => {
        if (state._tick) { clearInterval(state._tick); state._tick = null; }
        state.exam = null;
        navigate("sets");
      }}
    ]);
}

function playAudio(q) {
  const ex = state.exam;
  const isPractice = ex && ex.mode === "practice";
  if (!isPractice && (q.played || 0) >= MAX_PLAYS) {
    modal("Audio limit reached", `You can play audio only ${MAX_PLAYS} times per question.`);
    return;
  }
  stopAudio();
  q.played = (q.played || 0) + 1;
  const row = $("audRow");
  if (row) {
    row.classList.add("on");
    const span = row.querySelector("span");
    if (span) span.textContent = isPractice ? "∞" : `${Math.max(0, MAX_PLAYS - q.played)} left`;
  }
  const src = q.au;
  const done = () => { if (row) row.classList.remove("on"); };
  if (src.startsWith("tts:")) {
    if (!("speechSynthesis" in window)) { done(); return; }
    const u = new SpeechSynthesisUtterance(src.slice(4));
    u.lang = "ja-JP"; u.rate = 0.85;
    u.onend = u.onerror = done;
    speechSynthesis.speak(u);
  } else {
    state._audio = new Audio(resolveUrl(src));
    state._audio.onended = state._audio.onerror = done;
    state._audio.play().catch(done);
  }
}

async function approveRequest(rid, uid, type, planId) {
  try {
    await updateDoc(doc(db, "accessRequests", rid), { status: "approved" });
    if (type === "practice") {
      await updateDoc(doc(db, "users", uid), { practiceAccess: true });
    } else if (type === "premium" && planId) {
      const plan = state.plans.find(p => p.id === planId);
      if (plan) {
        const start = new Date();
        const expiry = new Date(Date.now() + plan.days * 86400000);
        await updateDoc(doc(db, "users", uid), {
          premium: { plan: plan.name, start, expiry }
        });
      }
    }
    toast("Request approved ✓", "ok");
    loadRequests();
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

async function rejectRequest(rid) {
  try {
    await updateDoc(doc(db, "accessRequests", rid), { status: "rejected" });
    toast("Request rejected", "ok");
    loadRequests();
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

function addQuestion() { openQEditor(-1); }
function editQ(idx) { openQEditor(idx); }

function openQEditor(idx) {
  const isEdit = idx >= 0;
  const item = isEdit ? state._allQs[idx] : null;
  const q = item ? item.q : { q: "", p: "", imgRaw: "", au: "", expl: "", o: ["","","",""], a: 0 };
  modal(isEdit ? "Edit Question" : "Add Question", `
    <div class="grid-2">
      <div class="field"><label>Set</label>
        <select id="qeSet" class="input">${SET_NAMES.map((s, i) =>
          `<option value="${i + 1}" ${(item && item.set === i + 1) ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
      <div class="field"><label>Section</label>
        <select id="qeSec" class="input">${SECTIONS.map(s =>
          `<option value="${s.key}" ${(item && item.section === s.key) ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Question</label>
      <textarea id="qeQ" class="input">${esc(q.q)}</textarea></div>
    <div class="field"><label>Passage (optional)</label>
      <textarea id="qeP" class="input">${esc(q.p || "")}</textarea></div>
    <div class="field"><label>Image filename or URL</label>
      <input type="text" id="qeImg" class="input" value="${esc(q.imgRaw || "")}" placeholder="photos/q1.jpg">
      <span class="muted small">e.g. <code>photos/q1.jpg</code> or full URL or <code>scene:rain</code></span></div>
    <div class="field"><label>Audio filename or URL</label>
      <input type="text" id="qeAu" class="input" value="${esc(q.au || "")}" placeholder="audio/q1.mp3">
      <span class="muted small">e.g. <code>audio/q1.mp3</code> or <code>tts:こんにちは</code></span></div>
    <div class="field"><label>Explanation (optional)</label>
      <textarea id="qeExpl" class="input" placeholder="Why this is the correct answer…">${esc(q.expl || "")}</textarea></div>
    <div class="field"><label>Correct Answer</label>
      <select id="qeAns" class="input">${"ABCD".split("").map((l, i) =>
        `<option value="${i}" ${q.a === i ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="grid-2">
      <div class="field"><label>A</label><input type="text" id="qeA" class="input" value="${esc(q.o[0])}"></div>
      <div class="field"><label>B</label><input type="text" id="qeB" class="input" value="${esc(q.o[1])}"></div>
      <div class="field"><label>C</label><input type="text" id="qeC" class="input" value="${esc(q.o[2])}"></div>
      <div class="field"><label>D (optional)</label><input type="text" id="qeD" class="input" value="${esc(q.o[3])}"></div>
    </div>
  `, [
    { label: "Cancel", cls: "btn-ghost" },
    { label: isEdit ? "Update" : "Add", cls: "btn-primary", onClick: () => saveQ(idx) }
  ]);
}

async function saveQ(idx) {
  const setNum = +$("qeSet").value;
  const section = $("qeSec").value;
  const question = $("qeQ").value.trim();
  const passage = $("qeP").value.trim();
  const image = $("qeImg").value.trim();
  const audio = $("qeAu").value.trim();
  const explanation = $("qeExpl").value.trim();
  const answer = "ABCD"[+$("qeAns").value];
  const A = $("qeA").value.trim(), B = $("qeB").value.trim();
  const C = $("qeC").value.trim(), D = $("qeD").value.trim();

  if (!question || !A || !B || !C) return toast("Question, A, B, C required", "err");
  if (answer === "D" && !D) return toast("Answer D but option D empty", "err");

  const newRow = { set: setNum, section, question, passage, image, audio, answer, A, B, C, D, explanation };

  try {
    const currentRows = await fetchQuestionsFromFirestore();
    const list = [...currentRows];
    if (idx >= 0) {
      const item = state._allQs[idx];
      const globalIdx = list.findIndex(r =>
        r.set === item.set && r.section === item.section &&
        r.question === item.q.q && r.A === item.q.o[0]);
      if (globalIdx >= 0) list[globalIdx] = newRow;
      else list.push(newRow);
    } else {
      list.push(newRow);
    }
    await setDoc(doc(db, QUESTIONS_DOC), { questions: list }, { merge: true });
    clearQCache();
    const fresh = await fetchQuestionsFromFirestore();
    setCache(fresh);
    state.sets = buildSets(fresh);
    recomputeTotals();
    loadQuestionsList();
    toast(idx >= 0 ? "Question updated ✓" : "Question added ✓", "ok");
  } catch (e) {
    console.error("saveQ", e);
    toast("Failed: " + e.message, "err");
  }
}

async function deleteQ(idx) {
  const item = state._allQs[idx];
  if (!item) return;
  modal("Delete this question?", `"${esc(item.q.q.slice(0, 60))}…" will be removed.`,
    [
      { label: "Cancel", cls: "btn-ghost" },
      { label: "Delete", cls: "btn-danger", onClick: async () => {
        try {
          const currentRows = await fetchQuestionsFromFirestore();
          const filtered = currentRows.filter(r =>
            !(r.set === item.set && r.section === item.section &&
              r.question === item.q.q && r.A === item.q.o[0]));
          await setDoc(doc(db, QUESTIONS_DOC), { questions: filtered }, { merge: true });
          clearQCache();
          const fresh = await fetchQuestionsFromFirestore();
          setCache(fresh);
          state.sets = buildSets(fresh);
          recomputeTotals();
          loadQuestionsList();
          toast("Question deleted ✓", "ok");
        } catch (e) { toast("Failed: " + e.message, "err"); }
      }}
    ]);
}

function previewQ(idx) {
  const item = state._allQs[idx];
  if (!item) return;
  const q = item.q;
  const imgResolved = q.imgRaw ? (q.imgRaw.startsWith("scene:") ? sceneData(q.imgRaw.slice(6)) : resolveUrl(q.imgRaw)) : "";
  modal("Question Preview", `
    <div class="flex mb-1" style="gap:6px;flex-wrap:wrap">
      <span class="badge badge-info">Set ${item.set}</span>
      <span class="badge badge-muted">${esc(item.sectionName)}</span>
      <span class="badge badge-muted">${item.marks} marks</span>
    </div>
    ${q.p ? `<div class="passage" style="margin-top:12px">${esc(q.p)}</div>` : ""}
    <div style="font-size:15px;font-weight:700;line-height:1.5;margin:12px 0;white-space:pre-line">${esc(q.q)}</div>
    ${imgResolved ? `<img src="${esc(imgResolved)}" style="width:100%;border-radius:10px;margin-bottom:12px;max-height:240px;object-fit:contain" onerror="this.style.display='none'">` : ""}
    ${q.au ? `<div class="muted small mb-2">🔊 ${esc(q.au)}</div>` : ""}
    ${q.o.map((t, i) => {
      if (i === 3 && !t) return "";
      const isC = i === q.a;
      return `<div style="padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-top:6px;font-size:13px;${isC ? "background:#d1fae5;border-color:var(--green);font-weight:700" : ""}">
        <b>${"ABCD"[i]}.</b> ${esc(t)} ${isC ? "✓" : ""}</div>`;
    }).join("")}
    ${q.expl ? `<div style="margin-top:12px;padding:10px;background:var(--bg);border-radius:8px;font-size:12px;line-height:1.5"><strong>💡 Explanation:</strong> ${esc(q.expl)}</div>` : ""}
  `);
}

async function refreshQuestions() {
  toast("Refreshing…");
  try {
    clearQCache();
    const fresh = await fetchQuestionsFromFirestore();
    setCache(fresh);
    state.sets = buildSets(fresh);
    recomputeTotals();
    loadQuestionsList();
    toast("Questions refreshed ✓", "ok");
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

function exportJSON() {
  (async () => {
    try {
      const rows = await fetchQuestionsFromFirestore();
      const blob = new Blob([JSON.stringify({ questions: rows }, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "questions.json"; a.click();
      URL.revokeObjectURL(url);
      toast("Downloaded questions.json", "ok");
    } catch (e) { toast("Failed: " + e.message, "err"); }
  })();
}

async function importJSON() {
  const text = $("importText")?.value.trim();
  if (!text) return toast("Paste JSON or upload file", "err");
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { return toast("Invalid JSON: " + e.message, "err"); }
  const rows = Array.isArray(parsed) ? parsed : parsed.questions;
  if (!Array.isArray(rows)) return toast("JSON must contain questions array", "err");
  if (!confirm(`Replace all questions with ${rows.length}? Cannot be undone.`)) return;
  try {
    await setDoc(doc(db, QUESTIONS_DOC), { questions: rows });
    clearQCache();
    const fresh = await fetchQuestionsFromFirestore();
    setCache(fresh);
    state.sets = buildSets(fresh);
    recomputeTotals();
    loadQuestionsList();
    toast(`Imported ${rows.length} questions ✓`, "ok");
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

async function saveAssetBase() {
  const val = $("assetBaseInput").value.trim();
  if (!val) return toast("Please enter a URL", "err");
  try {
    await setDoc(doc(db, "appConfig", "github"), { baseUrl: val }, { merge: true });
    ASSET_BASE = val;
    toast("Asset base saved ✓", "ok");
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

/* ============================================================
   STUDENT ACTIONS
   ============================================================ */
async function requestAccess() {
  try {
    const existing = await getDocs(query(
      collection(db, "accessRequests"),
      where("uid", "==", state.user.uid),
      where("status", "==", "pending")
    ));
    if (!existing.empty) return toast("Already have a pending request", "warn");
    await addDoc(collection(db, "accessRequests"), {
      uid: state.user.uid,
      email: state.profile?.email || state.user.email || "",
      name: state.profile?.name || "",
      type: "practice",
      status: "pending",
      createdAt: serverTimestamp()
    });
    toast("Access request submitted ✓", "ok");
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

async function requestPremium(planId) {
  const plan = state.plans.find(p => p.id === planId);
  if (!plan) return;
  try {
    const existing = await getDocs(query(
      collection(db, "accessRequests"),
      where("uid", "==", state.user.uid),
      where("status", "==", "pending"),
      where("planId", "==", planId)
    ));
    if (!existing.empty) return toast("Already requested this plan", "warn");
    await addDoc(collection(db, "accessRequests"), {
      uid: state.user.uid,
      email: state.profile?.email || state.user.email || "",
      name: state.profile?.name || "",
      type: "premium",
      planId, planName: plan.name, planPrice: plan.price,
      status: "pending",
      createdAt: serverTimestamp()
    });
    toast("Request sent to admin ✓", "ok");
  } catch (e) { toast("Failed: " + e.message, "err"); }
}

async function toggleBookmark(set, section, qi) {
  const s = state.sets[set - 1];
  if (!s) return;
  const sec = s.sections.find(x => x.key === section);
  if (!sec) return;
  const q = sec.questions[qi];
  if (!q) return;
  const id = qId(set, section, q.q);
  const newSet = new Set(state.bookmarks);
  if (newSet.has(id)) newSet.delete(id); else newSet.add(id);
  state.bookmarks = newSet;
  try {
    await updateDoc(doc(db, "users", state.user.uid), { bookmarks: [...newSet] });
    toast(newSet.has(id) ? "Bookmarked 🔖" : "Bookmark removed", "ok");
  } catch (e) { toast("Failed: " + e.message, "err"); }
  render();
}

/* ============================================================
   AUTH STATE LISTENER (parallel loading = fast)
   ============================================================ */
onAuthStateChanged(auth, async (user) => {
  if (state.userSub) { state.userSub(); state.userSub = null; }
  if (!user) {
    state.user = null; state.profile = null; state.isAdmin = false;
    navigate("login");
    return;
  }
  state.user = user;
  try {
    // Parallel load everything
    const [profile, qRes, plans, results, _] = await Promise.all([
      ensureUserProfile(user),
      loadQuestions().catch(e => ({ rows: [], error: e })),
      loadPlans(),
      loadResults(user.uid),
      loadConfig()
    ]);
    state.profile = profile;
    state.isAdmin = profile.role === "admin" ||
                    (user.email === ADMIN_EMAIL && user.emailVerified === true);
    if (qRes.rows && qRes.rows.length) {
      state.sets = buildSets(qRes.rows);
      recomputeTotals();
    }
    state.plans = plans;
    state.results = results;
    state.bookmarks = new Set(profile.bookmarks || []);

    if (profile.status === "blocked") {
      modal("Account Blocked", "Your account has been blocked. Contact the administrator.", [
        { label: "Logout", cls: "btn-danger", onClick: handleLogout }
      ]);
      state.isAdmin = false;
      navigate("home");
      return;
    }

    // Real-time profile listener
    state.userSub = onSnapshot(doc(db, "users", user.uid), (snap) => {
      if (snap.exists()) {
        const oldPrem = state.profile?.premium;
        state.profile = { uid: user.uid, ...snap.data() };
        state.bookmarks = new Set(state.profile.bookmarks || []);
        if (state.screen !== "exam" && state.screen !== "result") {
          // Only re-render if premium status changed or bookmarks changed
          const newPrem = state.profile.premium;
          if (JSON.stringify(oldPrem) !== JSON.stringify(newPrem) || state.screen === "home") render();
        }
      }
    });

    await touchStreak();
    navigate("home");
  } catch (e) {
    console.error("Auth init", e);
    navigate("error", { msg: e.message });
  }
});

/* Handle redirect auth result */
getRedirectResult(auth).catch(() => {});

  },

  openReview: (f) => navigate("review", { result: state.params.result, filter: f }),
  toggleBookmark,

  requestAccess, requestPremium,

  adminTab: (t) => { adminTab = t; render(); },
  filterStudents, filterQuestions,
  grantPremium, togglePractice, toggleBlock,
  approveRequest, rejectRequest,
  addQuestion, editQ, deleteQ, previewQ,
  refreshQuestions, exportJSON, importJSON, saveAssetBase
};

/* Start */
navigate("login");
